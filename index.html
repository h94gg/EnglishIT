let score = 0;

window.onload = () => {
    const container = document.getElementById('quiz-container');
    questions.forEach((qObj, index) => {
        let optionsHtml = '';
        qObj.options.forEach((opt, oIndex) => {
            optionsHtml += `
                <div class="option" onclick="checkAnswer(this, ${index}, ${oIndex})">
                    <strong>EN:</strong> ${opt.en}
                    <div class="ar-opt"><strong>AR:</strong> ${opt.ar}</div>
                </div>
            `;
        });
        
        container.innerHTML += `
            <div class="question-card">
                <div class="q-text">Q${index + 1}: ${qObj.q}</div>
                <button class="translate-btn" onclick="toggleTranslation(${index})">إظهار الترجمة (Show Translation)</button>
                <div class="translation-area" id="trans-${index}">${qObj.arQ}</div>
                <div id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="result-${index}" class="result-msg"></div>
            </div>
        `;
    });
    document.getElementById('scoreBox').innerText = `النتيجة: 0 / ${questions.length}`;
};

window.checkAnswer = function(element, qIndex, oIndex) {
    const parent = element.parentElement;
    if (parent.getAttribute('data-answered') === 'true') return;
    
    parent.setAttribute('data-answered', 'true');
    const qObj = questions[qIndex];
    const isCorrect = qObj.options[oIndex].correct;
    
    Array.from(parent.children).forEach(child => {
        child.style.pointerEvents = 'none';
        child.style.opacity = '0.7';
    });
    
    const resultMsg = document.getElementById(`result-${qIndex}`);
    
    if (isCorrect) {
        element.classList.add('correct');
        score++;
        resultMsg.innerHTML = '<span style="color: green;">✅ إجابة صحيحة!</span>';
    } else {
        element.classList.add('wrong');
        const correctOpt = qObj.options.find(o => o.correct);
        Array.from(parent.children).forEach(child => {
            if (child.innerHTML.includes(correctOpt.en)) child.classList.add('correct');
        });
        
        resultMsg.innerHTML = `
            <div style="direction: rtl; text-align: right; margin-bottom: 8px;">
                <span style="color: red; font-weight: bold; font-size: 16px;">❌ إجابة خاطئة! الإجابة الصحيحة هي:</span>
            </div>
            <div style="background-color: #d4edda; color: #155724; padding: 12px; border-radius: 8px; border: 1px solid #c3e6cb; margin-top: 10px;">
                <div style="direction: ltr; text-align: left; margin-bottom: 6px; font-size: 15px; border-bottom: 1px solid #b1dfbb; padding-bottom: 6px;">
                    <strong>EN:</strong> ${correctOpt.en}
                </div>
                <div style="direction: rtl; text-align: right; font-size: 15px; padding-top: 6px;">
                    <strong>AR:</strong> ${correctOpt.ar}
                </div>
            </div>
        `;
    }
    document.getElementById('scoreBox').innerText = `النتيجة: ${score} / ${questions.length}`;
};

window.toggleTranslation = function(index) {
    const area = document.getElementById(`trans-${index}`);
    const optionsAr = document.querySelectorAll(`#options-${index} .ar-opt`);
    
    if (area.style.display === 'block') {
        area.style.display = 'none';
        optionsAr.forEach(opt => opt.style.display = 'none');
    } else {
        area.style.display = 'block';
        optionsAr.forEach(opt => opt.style.display = 'block');
    }
};
